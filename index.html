<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OperaciónBikini</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de login -->
  <section id="pantalla-login" class="pantalla oculta">
    <h1>OperaciónBikini</h1>

    <form id="form-login">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username">

      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password">

      <button type="submit" id="btn-entrar">Entrar</button>
    </form>

    <p class="separador">o</p>

    <button type="button" id="btn-google">Entrar con Google</button>

    <p id="error-login" class="error" role="alert"></p>
  </section>

  <!-- Pantalla principal -->
  <section id="pantalla-principal" class="pantalla oculta">
    <header>
      <span id="email-usuario"></span>
      <button type="button" id="btn-salir">Cerrar sesión</button>
    </header>

    <nav id="pestanas">
      <button type="button" class="pestana" data-seccion="peso">Peso</button>
      <button type="button" class="pestana" data-seccion="comidas">Comidas</button>
      <button type="button" class="pestana" data-seccion="ejercicio">Ejercicio</button>
    </nav>

    <!-- Sección: Peso (spec 001, solo cambia de sitio) -->
    <div class="seccion" data-seccion="peso">
      <h2>Nuevo pesaje</h2>
      <form id="form-pesaje">
        <label for="peso">Peso (kg)</label>
        <input type="text" id="peso" inputmode="decimal" placeholder="82,4">

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">

        <button type="submit" id="btn-guardar">Guardar pesaje</button>
      </form>

      <p id="error-pesaje" class="error" role="alert"></p>

      <h2>Mis pesajes</h2>
      <p id="estado-lista"></p>
      <button type="button" id="btn-reintentar" class="oculta">Reintentar</button>
      <ul id="lista-pesajes"></ul>
    </div>

    <!-- Sección: Comidas -->
    <div class="seccion" data-seccion="comidas">
      <h2>Nueva comida</h2>
      <form id="form-comida">
        <label for="comida-texto">Qué has comido</label>
        <textarea id="comida-texto" rows="2" placeholder="lentejas y una manzana"></textarea>

        <label for="comida-momento">Momento</label>
        <select id="comida-momento"></select>

        <label for="comida-fecha">Fecha</label>
        <input type="date" id="comida-fecha">

        <button type="submit" id="btn-guardar-comida">Guardar comida</button>
      </form>

      <p id="error-comida" class="error" role="alert"></p>

      <h2>Mis comidas</h2>
      <p id="estado-comidas"></p>
      <button type="button" id="btn-reintentar-comidas" class="oculta">Reintentar</button>
      <ul id="lista-comidas"></ul>
    </div>

    <!-- Sección: Ejercicio -->
    <div class="seccion" data-seccion="ejercicio">
      <h2>Nuevo ejercicio</h2>
      <form id="form-ejercicio">
        <label for="ejercicio-texto">Qué has hecho</label>
        <input type="text" id="ejercicio-texto" placeholder="bici">

        <label for="ejercicio-minutos">Minutos</label>
        <input type="text" id="ejercicio-minutos" inputmode="numeric" placeholder="45">

        <label for="ejercicio-intensidad">Intensidad</label>
        <select id="ejercicio-intensidad"></select>

        <label for="ejercicio-fecha">Fecha</label>
        <input type="date" id="ejercicio-fecha">

        <button type="submit" id="btn-guardar-ejercicio">Guardar ejercicio</button>
      </form>

      <p id="error-ejercicio" class="error" role="alert"></p>

      <h2>Mis ejercicios</h2>
      <p id="estado-ejercicios"></p>
      <button type="button" id="btn-reintentar-ejercicios" class="oculta">Reintentar</button>
      <ul id="lista-ejercicios"></ul>
    </div>
  </section>

  <!-- Pantalla de carga inicial, mientras Firebase decide si hay sesión -->
  <section id="pantalla-cargando" class="pantalla">
    <p>Cargando…</p>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
